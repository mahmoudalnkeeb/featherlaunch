[package]
name = "featherlaunch"
version = "1.0.0"
edition = "2024"
# let-chains in `if` conditions.
rust-version = "1.88"
description = "A minimal Minecraft launcher for low-end PCs"
license = "GPL-3.0-only"
repository = "https://github.com/mahmoudalnkeeb/featherlaunch"
publish = false

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "fs", "process", "io-util", "time", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Windows Credential Manager; on Linux the Secret Service (GNOME Keyring, KWallet) over pure-Rust D-Bus.
keyring = { version = "3", features = ["windows-native", "async-secret-service", "async-io", "crypto-rust"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
directories = "5"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
open = "5"
minisign-verify = "0.3"

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
# Schannel: no OpenSSL to ship.
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "stream", "multipart"] }
# Borderless window style fix (src/ui/chrome.rs).
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
raw-window-handle = "0.6"

[target.'cfg(not(windows))'.dependencies]
# rustls, so the binary does not depend on the distro's OpenSSL version.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"] }
# Adoptium ships Linux JREs as .tar.gz.
tar = "0.4"
flate2 = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Dependencies are optimized even in debug builds so the dev build stays usable on slow PCs.
[profile.dev.package."*"]
opt-level = 2
