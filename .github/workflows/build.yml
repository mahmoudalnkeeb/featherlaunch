name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build release
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/featherlaunch.exe dist/
          "{0:N1} MB" -f ((Get-Item dist/featherlaunch.exe).Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: featherlaunch-windows-x64
          path: dist/

  linux:
    # 22.04 so the binary runs on older distros too (glibc 2.35).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build release
        run: cargo build --release --locked

      - name: Package
        run: |
          mkdir -p dist/featherlaunch
          cp target/release/featherlaunch packaging/linux/featherlaunch.desktop dist/featherlaunch/
          cp assets/icon-256.png dist/featherlaunch/featherlaunch.png
          cp LICENSE THIRD_PARTY_NOTICES.md dist/featherlaunch/
          tar -C dist -czf dist/featherlaunch-linux-x64.tar.gz featherlaunch
          tar -tzvf dist/featherlaunch-linux-x64.tar.gz
          sudo apt-get install -y -qq desktop-file-utils > /dev/null
          desktop-file-validate dist/featherlaunch/featherlaunch.desktop
          echo "Linked libraries:"; ldd target/release/featherlaunch

      - uses: actions/upload-artifact@v4
        with:
          name: featherlaunch-linux-x64
          path: dist/featherlaunch-linux-x64.tar.gz

  # Tagged builds only. In-app updates and the website both read this release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The launcher compares the tag with its own version, so a mismatch would offer the same
      # update forever.
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi

      # A build without the real key could never install another update.
      - name: Check the signing key is set
        run: |
          if grep -q 'REPLACE_WITH_RELEASE_PUBLIC_KEY' src/updater.rs; then
            echo "::error::Set PUBLIC_KEY in src/updater.rs"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Install minisign
        run: |
          curl -fsSL -o minisign.tar.gz https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
          echo "9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  minisign.tar.gz" | sha256sum -c -
          tar -xzf minisign.tar.gz minisign-linux/x86_64/minisign
          sudo install minisign-linux/x86_64/minisign /usr/local/bin/

      # The launcher only installs a file whose trusted comment names its version and file.
      - name: Sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          cd dist
          for file in featherlaunch.exe featherlaunch-linux-x64.tar.gz; do
            minisign -S -s "$key" -m "$file" -t "featherlaunch ${GITHUB_REF_NAME#v} $file"
          done
          sha256sum featherlaunch.exe featherlaunch-linux-x64.tar.gz > SHA256SUMS.txt

      - name: Take the release notes from CHANGELOG.md
        run: |
          awk -v version="${GITHUB_REF_NAME#v}" '
            index($0, "## " version " ") == 1 { found = 1; next }
            /^## / { found = 0 }
            found
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/featherlaunch.exe
            dist/featherlaunch.exe.minisig
            dist/featherlaunch-linux-x64.tar.gz
            dist/featherlaunch-linux-x64.tar.gz.minisig
            dist/SHA256SUMS.txt
            THIRD_PARTY_NOTICES.md
